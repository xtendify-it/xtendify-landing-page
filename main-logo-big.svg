      <path d="M -28,28 L -65,65 M -65,65 L -40,65 M -65,65 L -65,40" />
      
      <path d="M 28,28 L 65,65 M 65,65 L 40,65 M 65,65 L 65,40" />
    </g>
  </g>
  
  <g transform="translate(230, 122)">
    <text class="logo-text" x="0" y="0">XTENDIFY</text>
    <text class="logo-tagline" x="4" y="32">SIDE-BY-SIDE EXTENSIBILITY PLATFORM</text>

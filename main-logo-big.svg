    <g stroke="url(#xtendifyGradient)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -28,-28 L -65,-65 M -65,-65 L -40,-65 M -65,-65 L -65,-40" />
      

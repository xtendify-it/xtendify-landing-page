<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 220" width="100%" height="100%">
  <defs>
    <linearGradient id="xtendifyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#00e676" />
    </linearGradient>
    <style>
      .logo-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 800; font-size: 60px; fill: #ffffff; letter-spacing: 6px; }
      .logo-tagline { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #a0a0a0; letter-spacing: 3.5px; }
    </style>
  </defs>
  
  <rect width="100%" height="100%" fill="#222222" rx="15" />
  
  <g transform="translate(120, 110)">
